<script>
async function mulai() {
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const audio = new AudioContext();
  await audio.resume();

  const mic = audio.createMediaStreamSource(stream);
  const analyser = audio.createAnalyser();
  analyser.fftSize = 512;
  mic.connect(analyser);

  const data = new Uint8Array(analyser.fftSize);
  let terakhir = 0;

  function cek() {
    analyser.getByteTimeDomainData(data);
    const volume = Math.max(...data.map(n => Math.abs(n - 128)));

    if (volume > 20 && Date.now() - terakhir > 300) {
      terakhir = Date.now();
      clearTimeout(window.timerTepuk);
      window.timerTepuk = setTimeout(() => {
        stream.getTracks().forEach(t => t.stop());
        audio.close();
        window.print();
      }, 500);
    }

    if (stream.active) requestAnimationFrame(cek);
  }

  cek();
}
</script>
